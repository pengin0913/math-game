<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小數學互動遊戲平台</title>
  <!-- 引入 Tailwind CSS 加速美化 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 避免白板誤觸反白 */
    body { user-select: none; }
  </style>
</head>
<body class="bg-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- 頂部導航列 -->
  <header class="bg-indigo-700 text-white px-6 py-3 flex items-center justify-between shadow-md z-10">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🎮</span>
      <h1 class="text-xl font-bold tracking-wide">數學遊戲遊樂園</h1>
    </div>

    <!-- 遊戲切換標籤頁 (Tabs) -->
    <nav class="flex space-x-2 bg-indigo-800/60 p-1 rounded-xl">
      <button onclick="switchGame('multiplication-battle.html', this)" 
              class="tab-btn px-4 py-2 rounded-lg font-medium transition text-indigo-100 hover:bg-indigo-600/50">
        ✖️ 九九乘法對戰
      </button>
      <button onclick="switchGame('super-tic-tac-toe.html', this)" 
              class="tab-btn px-4 py-2 rounded-lg font-medium transition text-indigo-100 hover:bg-indigo-600/50">
        ⭕ 超級井字遊戲
      </button>
      <button onclick="switchGame('factor-multiple-solitaire.html', this)" 
              class="tab-btn px-4 py-2 rounded-lg font-medium transition text-indigo-100 hover:bg-indigo-600/50">
        🃏 因倍數接龍
      </button>
    </nav>

    <!-- 工具按鈕：重新整理與全螢幕 -->
    <div class="flex items-center space-x-2">
      <button onclick="reloadGame()" title="重新載入遊戲" class="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm">
        🔄 重開
      </button>
      <button onclick="toggleFullScreen()" title="全螢幕" class="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm">
        ⛶ 全螢幕
      </button>
    </div>
  </header>

  <!-- 遊戲展示容器 (iframe) -->
  <main class="flex-1 w-full bg-slate-900 relative">
    <iframe id="gameFrame" 
            src="multiplication-battle.html" 
            class="w-full h-full border-none"
            allow="fullscreen">
    </iframe>
  </main>

  <script>
    const iframe = document.getElementById('gameFrame');
    const buttons = document.querySelectorAll('.tab-btn');

    // 切換遊戲邏輯
    function switchGame(url, btnElement) {
      if (iframe.getAttribute('src') === url) return;
      iframe.src = url;
      updateActiveButton(btnElement);
    }

    // 更新按鈕選中樣式
    function updateActiveButton(activeBtn) {
      buttons.forEach(btn => {
        btn.classList.remove('bg-white', 'text-indigo-900', 'shadow-sm');
        btn.classList.add('text-indigo-100');
      });
      activeBtn.classList.remove('text-indigo-100');
      activeBtn.classList.add('bg-white', 'text-indigo-900', 'shadow-sm');
    }

    // 重新載入目前遊戲
    function reloadGame() {
      iframe.contentWindow.location.reload();
    }

    // 全螢幕切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`全螢幕切換失敗: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 初始化第一個按鈕狀態
    document.addEventListener('DOMContentLoaded', () => {
      updateActiveButton(buttons[0]);
    });
  </script>
</body>
</html>
